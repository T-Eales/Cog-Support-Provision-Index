# Seed keyword dictionary for the retrieval filter and the keyword/rule-based baseline
# classifier (see docs/methodology.md §5). This is a STARTING POINT drafted from the rubric's
# operational definitions (docs/scoring_rubric.md), meant to be piloted on 2-3 documents and
# refined before the development set is frozen.
#
# `adhd_filter` — used at passage-extraction time to decide whether a paragraph is even a
# candidate ADHD passage worth coding.
# `domains.*.keywords` — surface-language cues the baseline model matches on (case-insensitive,
# word-stem aware via the trailing `*`) to guess which of Brown's (2013) four domains a passage
# targets (Step 1 of the rubric).
# `provision_signals.*.keywords` — surface-language cues the baseline uses to guess the
# provision level (Step 2 of the rubric) once a domain has been detected. These are NOT a
# substitute for human coding — they're what makes the baseline "transparent" and give the
# researcher something concrete to beat with the TF-IDF/embedding models.

adhd_filter:
  keywords:
    - ADHD
    - attention deficit hyperactivity disorder
    - attention deficit
    - neurodevelopmental
    - executive function*
    - hyperactiv*
    - impulsiv*

domains:
  attention:
    label: Attention (ATT)
    keywords:
      - concentrat*
      - focus*
      - distractib*
      - attention span
      - sustain* attention
      - shifting attention
      - daydream*
  persistence:
    label: Persistence (PER)
    keywords:
      - persist*
      - sustain* effort
      - see through
      - follow* through
      - task completion
      - procrastinat*
      - processing speed
      - alertness
  emotional_self_regulation:
    label: Emotional Self-Regulation (ESR)
    keywords:
      - emotional regulation
      - emotion* dysregulat*
      - frustration
      - mood swing*
      - anger management
      - distress tolerance
      - modulat* emotion*
  working_memory:
    label: Working Memory (WM)
    keywords:
      - working memory
      - forgetful*
      - hold* information in mind
      - recall
      - remember* instructions
      - misplac*
      - organisation
      - organization

provision_signals:
  no_support:
    label: No Support (1)
    notes:
      - default when a domain keyword is matched but no signposting/general/targeted signal is
        present in the same passage
  signposting:
    label: Signposting (2)
    keywords:
      - visit the website
      - for more information
      - charity
      - contact [a-z ]+ for support
      - directed to
      - further guidance is available at
      - external support
  general_support:
    label: General Support (3)
    keywords:
      - may be beneficial
      - psychological therapies
      - support is available
      - help is available
      - therapies may help
      - can be helpful
  targeted_support:
    label: Targeted Support (4)
    keywords:
      - structured programme
      - structured course
      - the service provides
      - we offer
      - week course
      - referral to
      - commissioned
      - named intervention
